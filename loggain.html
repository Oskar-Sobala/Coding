<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Logga in på ditt Fiskelycka-konto och planera nästa tur."
    />
    <title>Logga in | Fiskelycka</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-image" aria-label="En fiskare vid en stilla sjö i morgonljus">
        <a class="logo login-logo" href="index.html">FISKE<span>LYCKA</span></a>
        <div class="login-image-copy">
          <p class="eyebrow">DIN TID VID VATTNET</p>
          <p>Fler turer. Fler minnen.</p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <a class="login-back" href="index.html">Tillbaka till startsidan <span aria-hidden="true">&rarr;</span></a>
        <div class="login-content">
          <p class="eyebrow green">VÄLKOMMEN TILLBAKA</p>
          <h1 id="login-title">Logga in</h1>
          <p class="login-lead">Följ dina favoritvatten och planera nästa fisketur.</p>

          <form class="login-form" action="#" method="post" data-login-form>
            <div class="field-group">
              <label for="login-email">E-postadress</label>
              <input
                id="login-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="namn@exempel.se"
                required
              />
            </div>

            <div class="field-group">
              <div class="label-row">
                <label for="login-password">Lösenord</label>
                <a href="mailto:hej@fiskelycka.se?subject=Aterstall%20losenord">Glömt lösenord?</a>
              </div>
              <div class="password-input">
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Ditt lösenord"
                  required
                />
                <button class="password-toggle" type="button" aria-controls="login-password" aria-pressed="false">Visa</button>
              </div>
            </div>

            <label class="remember-me" for="remember-me">
              <input id="remember-me" name="remember" type="checkbox" />
              <span>Kom ihåg mig på den här enheten</span>
            </label>

            <button class="button login-submit" type="submit">Logga in <span aria-hidden="true">&rarr;</span></button>
            <p class="login-status" aria-live="polite" data-login-status></p>
          </form>

          <p class="signup-prompt">Ny hos Fiskelycka? <a href="kontakt.html">Skapa ett konto</a></p>
        </div>
      </section>
    </main>
    <script src="javascript.js"></script>
  </body>
</html>
