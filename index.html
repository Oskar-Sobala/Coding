<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkylator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Kalkylator">
        <output class="display" id="display" aria-live="polite">0</output>
        <div class="buttons">
            <button class="action" data-action="clear">C</button><button class="action" data-action="delete" aria-label="Ta bort senaste siffran">⌫</button><button class="operator" data-operator="%">%</button><button class="operator" data-operator="/">÷</button>
            <button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-operator="*">×</button>
            <button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-operator="-">−</button>
            <button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="operator" data-operator="+">+</button>
            <button class="zero" data-number="0">0</button><button data-action="decimal">,</button><button class="equals" data-action="calculate">=</button>
        </div>
    </main>
    <script src="javascript.js"></script>
</body>
</html>
